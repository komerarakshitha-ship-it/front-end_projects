<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6fb">
    <title>Create account | Login</title>
    <link rel="stylesheet" href="form.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page-shell">
        <section class="auth-card" aria-labelledby="page-title">
            <a class="brand" href="form.html" aria-label="Login home">
                <span class="brand-mark" aria-hidden="true">L</span>
                <span>luma<span class="brand-dot">.</span></span>
            </a>
            <div class="step-indicator" aria-label="Step 1 of 3">
                <span class="step active"></span><span class="step"></span><span class="step"></span>
            </div>
            <p class="eyebrow">GET STARTED</p>
            <h1 id="page-title">Create your account</h1>
            <p class="subtitle">A few details and you’ll be ready to go.</p>

            <form class="auth-form" action="form.html" method="post" data-account-form>
                <div class="field">
                    <label for="name">Full name</label>
                    <input id="name" name="name" type="text" placeholder="e.g. Alex Morgan" autocomplete="name" required>
                </div>
                <div class="field">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="new-password">Create password</label>
                    <div class="password-field">
                        <input id="new-password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
                        <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
                    </div>
                    <small class="field-hint">Use at least 8 characters.</small>
                </div>
                <div class="field">
                    <label for="confirm-password">Confirm password</label>
                    <div class="password-field">
                        <input id="confirm-password" name="confirmPassword" type="password" placeholder="Enter your password again" autocomplete="new-password" minlength="8" required>
                        <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
                    </div>
                    <small class="field-error" data-password-error aria-live="polite"></small>
                </div>
                <button class="primary-button" type="submit">Create account <span aria-hidden="true">→</span></button>
            </form>

            <p class="switch-prompt">Already have an account? <a href="form.html">Log in</a></p>
            <p class="demo-note">Demo interface — account details are not saved.</p>
        </section>
        <footer class="page-footer">Simple, secure access to your account.</footer>
    </main>
</body>
</html>
