<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6fb">
    <title>Enter your password | Luma</title>
    <link rel="stylesheet" href="form.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page-shell">
        <section class="auth-card" aria-labelledby="page-title">
            <a class="brand" href="form.html" aria-label="Login home">
                <span class="brand-mark" aria-hidden="true">L</span>
                <span>luma<span class="brand-dot">.</span></span>
            </a>
            <div class="step-indicator" aria-label="Step 3 of 3">
                <span class="step complete"></span><span class="step complete"></span><span class="step active"></span>
            </div>
            <p class="eyebrow">ALMOST THERE</p>
            <h1 id="page-title">Enter your password</h1>
            <p class="subtitle">Enter your password to finish logging in.</p>

            <form class="auth-form" action="success.html" method="post">
                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required>
                        <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
                    </div>
                </div>
                <button class="primary-button" type="submit">Continue <span aria-hidden="true">→</span></button>
            </form>

            <p class="switch-prompt"><a href="form.html">← Back to login</a></p>
            <p class="demo-note">Demo interface — your password is not checked or saved.</p>
        </section>
        <footer class="page-footer">Simple, secure access to your account.</footer>
    </main>
</body>
</html>
